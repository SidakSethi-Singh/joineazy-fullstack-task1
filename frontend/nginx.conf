server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls from the browser go to the backend container.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
