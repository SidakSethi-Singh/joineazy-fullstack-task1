services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: joineazy
      POSTGRES_PASSWORD: joineazy
      POSTGRES_DB: joineazy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joineazy -d joineazy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://joineazy:joineazy@db:5432/joineazy
      JWT_SECRET: change-me-in-production
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Seeds the database on first start (safe to re-run: it recreates the tables).
    command: sh -c "node src/seed.js && node src/server.js"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
